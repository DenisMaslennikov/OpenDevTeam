[project]
name = "opendevteam-agents-core"
version = "0.1.0"
description = "Общее переиспользуемое для агентов OpenDevTeam (LangGraph утилы, watchdog, litellm-клиент)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph",
    "litellm",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "docker",
    "aio-pika",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_core"]
