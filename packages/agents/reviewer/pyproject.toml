[project]
name = "opendevteam-reviewer"
version = "0.1.0"
description = "Агент-ревьюер OpenDevTeam"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opendevteam-agents-core",
    "langgraph",
    "litellm",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "gitpython",
    "aio-pika",
]

[project.scripts]
opendevteam-reviewer = "reviewer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer"]
