[project]
name = "opendevteam"
version = "0.1.0"
description = "Система для агентской ИИ-разработки. MVP: автоматическое написание тестов для кода."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "TBD" }

[tool.uv.workspace]
members = [
    "packages/backend",
    "packages/agents/core",
    "packages/agents/team_lead",
    "packages/agents/worker",
    "packages/agents/reviewer",
]

[tool.uv.sources]
opendevteam-backend = { workspace = true }
opendevteam-agents-core = { workspace = true }
opendevteam-team-lead = { workspace = true }
opendevteam-worker = { workspace = true }
opendevteam-reviewer = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["opendevteam"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
