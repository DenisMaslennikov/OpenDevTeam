apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: opendevteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: opendevteam/backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: db-secrets
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: LITELLM_BASE_URL
              value: "http://litellm:4000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: opendevteam
spec:
  selector:
    app: backend
  ports:
    - port: 8000
