apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: opendevteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: opendevteam/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: opendevteam
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 5173
