apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: opendevteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: opendevteam/cache:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: cache-data
              mountPath: /var/lib/registry
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
      volumes:
        - name: cache-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: opendevteam
spec:
  selector:
    app: cache
  ports:
    - port: 5000
