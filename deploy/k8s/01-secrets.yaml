apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: opendevteam
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "change-me-in-production"
  LLM_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: opendevteam
type: Opaque
stringData:
  POSTGRES_USER: "opendevteam"
  POSTGRES_PASSWORD: "change-me"
  POSTGRES_DB: "opendevteam"
  DATABASE_URL: "postgresql://opendevteam:change-me@postgres:5432/opendevteam"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: opendevteam
type: Opaque
stringData:
  RABBITMQ_USER: "opendevteam"
  RABBITMQ_PASSWORD: "change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: git-secrets
  namespace: opendevteam
type: Opaque
stringData:
  ssh-private-key: ""
  ssh-known-hosts: ""
  github-token: ""
  gitlab-token: ""
  git-user-name: "OpenDevTeam Bot"
  git-user-email: "bot@opendevteam.local"
