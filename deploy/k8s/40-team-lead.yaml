apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-lead
  namespace: opendevteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-lead
  template:
    metadata:
      labels:
        app: team-lead
    spec:
      serviceAccountName: team-lead
      containers:
        - name: team-lead
          image: opendevteam/team_lead:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: db-secrets
            - secretRef:
                name: litellm-secrets
            - secretRef:
                name: rabbitmq-secrets
          env:
            - name: LITELLM_BASE_URL
              value: "http://litellm:4000"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq:5672"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-lead
  namespace: opendevteam
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: team-lead
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: team-lead
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: team-lead
subjects:
  - kind: ServiceAccount
    name: team-lead
    namespace: opendevteam
