apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: opendevteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: opendevteam/litellm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
            - secretRef:
                name: db-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: opendevteam
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
